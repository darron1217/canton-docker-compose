# 원격 콘솔(bootstrap / console 서비스)이 각 노드의 Admin API 에 접속할 때 쓰는 설정.
# token 값이 모든 Admin API 호출의 "Authorization: Bearer <token>" 헤더로 전송됩니다.
canton {
  features.enable-preview-commands = yes

  remote-participants.participant {
    admin-api { address = "participant", port = 5002 }
    ledger-api { address = "participant", port = 5001 }
    token = ${PARTICIPANT_ADMIN_TOKEN}
  }

  remote-sequencers.sequencer {
    admin-api { address = "sequencer", port = 5009 }
    public-api { address = "sequencer", port = 5008 }
    token = ${SEQUENCER_ADMIN_TOKEN}
  }

  remote-mediators.mediator {
    admin-api { address = "mediator", port = 5007 }
    token = ${MEDIATOR_ADMIN_TOKEN}
  }
}
