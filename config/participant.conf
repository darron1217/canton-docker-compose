canton {
  participants {
    participant {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          properties {
            serverName = "postgres"
            portNumber = 5432
            databaseName = "participant"
            user = ${POSTGRES_USER}
            password = ${POSTGRES_PASSWORD}
          }
        }
      }

      admin-api {
        address = "0.0.0.0"
        port = 5002

        # ---- Admin API 인증 (ES256 JWT) ----
        # 설정하지 않으면 Admin API는 인증 없이 열립니다.
        auth-services = [{
          type = jwt-es-256-crt
          # 토큰 서명을 검증할 X.509 인증서(공개키). 개인키는 노드에 두지 않습니다.
          certificate = "/keys/admin-jwt.crt"
          # 토큰의 aud 클레임이 이 값과 같아야 합니다.
          target-audience = ${PARTICIPANT_ADMIN_AUDIENCE}
          # 서명과 aud 만 맞으면 sub 와 무관하게 Admin 권한을 부여합니다.
          privileged = true
          access-level = admin
          # exp 클레임이 없거나 남은 유효기간이 이보다 긴 토큰은 거부합니다.
          max-token-life = 24h
        }]
      }

      # 이 예제는 Admin API 인증만 다룹니다. Ledger API 는 인증 없이 열려 있습니다.
      ledger-api {
        address = "0.0.0.0"
        port = 5001
      }
      http-ledger-api {
        address = "0.0.0.0"
        port = 7575
      }

      monitoring.grpc-health-server {
        address = "0.0.0.0"
        port = 5061
      }
    }
  }
}
