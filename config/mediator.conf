canton {
  mediators {
    mediator {
      storage {
        type = postgres
        config {
          dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
          properties {
            serverName = "postgres"
            portNumber = 5432
            databaseName = "mediator"
            user = ${POSTGRES_USER}
            password = ${POSTGRES_PASSWORD}
          }
        }
      }

      admin-api {
        address = "0.0.0.0"
        port = 5007

        # ---- Admin API 인증 (ES256 JWT) ----
        auth-services = [{
          type = jwt-es-256-crt
          # 토큰 서명을 검증할 X.509 인증서(공개키). 개인키는 노드에 두지 않습니다.
          certificate = "/keys/admin-jwt.crt"
          target-audience = ${MEDIATOR_ADMIN_AUDIENCE}
          privileged = true
          access-level = admin
          # exp 클레임이 없거나 남은 유효기간이 이보다 긴 토큰은 거부합니다.
          max-token-life = 24h
        }]
      }

      monitoring.grpc-health-server {
        address = "0.0.0.0"
        port = 5061
      }
    }
  }
}
